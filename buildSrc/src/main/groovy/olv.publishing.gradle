plugins {
    id 'org.jreleaser'
    id 'maven-publish'
}

java {
    withJavadocJar()
    withSourcesJar()
}

//Create artefacts under build/staging-deploy
//run ./gradlew.bat publish
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'OtrosLogViewer API'
                description = 'API for OtrosLogViewer plugins and integrations'
                url = 'https://github.com/otros-systems/otroslogviewer'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'svennissel'
                        name = 'Sven Nissel'
                        email = 'sven@nissel.it'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/otros-systems/otroslogviewer.git'
                    developerConnection = 'scm:git:ssh://github.com/otros-systems/otroslogviewer.git'
                    url = 'https://github.com/otros-systems/otroslogviewer'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

//Test with: ./gradlew.bat :olv-api:jreleaserConfig --no-configuration-cache
//Deploy on sonartype.com: ./gradlew.bat :olv-api:jreleaserDeploy --no-configuration-cache

// Generate token on sonartype and set environment variables:
//$env:JRELEASER_MAVENCENTRAL_PASSWORD = ""
//$env:JRELEASER_MAVENCENTRAL_USERNAME = "TOKEN_KEY"

//Generate GPG Key publish it
//gpg --full-generate-key
//gpg --list-secret-keys --keyid-format LONG
//gpg --armor --export-secret-keys 1234567890ABCDEF > private-key.asc
//gpg --keyserver keyserver.ubuntu.com --send-keys 1234567890ABCDEF
//gpg --armor --export 1234567890ABCDEF > public-key.asc
//$env:JRELEASER_GPG_SECRET_KEY = Get-Content private-key.asc -Raw
//$env:JRELEASER_GPG_PASSPHRASE = "PASSWORD"

//GITHUB_TOKEN is not needed, but environment variable must be set
//$env:JRELEASER_GITHUB_TOKEN = "dummy"
jreleaser {
    //Search .git directory in multi module project
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
    }
    //Do not want any automatic release on github
    release {
        github {
            enabled = true
            skipRelease = true
        }
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
}
