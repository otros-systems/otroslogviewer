plugins {
    id 'olv.java-conventions'
    id 'com.gradleup.shadow'
}

def today = new Date().format("yyyy-MM-dd")
dependencies {
    implementation project(':olv-gui')
    implementation project(':olv-vfs')
    implementation project(':olv-api')
    implementation project(':olv-parser')

    implementation(libs.radiancetheming)
    implementation(libs.radianceAnimation)
    implementation(libs.swingx)
    implementation(libs.miglayout)
    implementation(libs.jcommander)
    implementation(libs.guava)
    implementation(libs.gson)

    implementation(libs.jzlib)

    implementation(libs.rsyntaxtextarea)

    implementation(libs.commonsLang)
    implementation(libs.commonsNet)
    implementation(libs.commonsConfiguration2)
    implementation(libs.commonsCollections)
    implementation(libs.commonsVfs2)
    implementation(libs.log4jApi)
    implementation(libs.log4jCore)
    //jna is needed for the PageantConnector to use the Pageant with sftp connections
    implementation(libs.jnaJpms)
    implementation(libs.jnaPlatformJpms)


    implementation(libs.jxlayer)

    implementation(libs.logbackCore)
    implementation(libs.logbackClassic)


    testImplementation(libs.testng)
    testImplementation(libs.mockitoCore)
    testImplementation(libs.assertjCore)
    testImplementation(libs.awaitility)
    testImplementation(libs.wiremock)
}

jar {
    manifest.mainAttributes(
            'Implementation-Title': 'OtrosLogViewer-app',
            'Implementation-Version': project.version,
            'Main-Class': "pl.otros.logview.gui.LogViewMainFrame",
            'Build-day': today,
            'Build-date': new Date(),
            'SplashScreen-Image': "img/otros/splash.png"
    )
}

test {
    useTestNG()
    maxParallelForks = 2
}

shadowJar {
    archiveBaseName.set('olv')
    archiveClassifier.set('exec')
    archiveVersion.set('')
}

//--add-opens', 'java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED is olny needed for windows
tasks.register('runWithJavaExec', JavaExec) {
    group = "Execution"
    description = "Run the main class with JavaExecTask"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("pl.otros.logview.gui.LogViewMainFrame")
    jvmArgs = ['-splash:src/main/resources/img/otros/splash.png', '--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED']
}

//This configuration shares the output from the shadowJar task for other modules to consume it
configurations {
    instrumentedJars {
        canBeConsumed = true
        canBeResolved = false
        // If you want this configuration to share the same dependencies, otherwise omit this line
        extendsFrom implementation, runtimeOnly
    }
}

artifacts {
    instrumentedJars shadowJar
}

//The line below ensures the uber-jar is generated when 'gradle build' is executed
project.tasks.build.dependsOn shadowJar
