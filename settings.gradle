pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'olv'
include 'olv-api', 'olv-core', 'olv-dist', 'olv-gui', 'olv-vfs', 'olv-parser', 'olv-tests'